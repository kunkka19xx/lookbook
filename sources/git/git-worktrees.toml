# Worktrees of the project you have selected.
#
# A second file in the same folder as git-branches.toml. They are separate
# blocks with nothing between them, so install one, the other, or both.
#
# Like branches, this is a drill-down: `run` names {path}, so it only means
# something against a selected repo.

[git-worktrees]
name = "Worktrees"
icon = "🌳"
run  = "git -C {path} worktree list | awk '{ branch = $NF; gsub(/[][]/, \"\", branch); print $1 \"\\t\" branch \"\\t\" $1 }'"
open = "open {id}"

# Asked by the installer: `open` is macOS, the other two are Linux and Windows.
[[setup]]
label = "Open a folder with"
type  = "choice"
block = "git-worktrees"
key   = "open"
match = "open"
options = ["open", "xdg-open", "explorer"]
