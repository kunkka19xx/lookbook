# One row that opens everything you start the day with.
#
# A `do` block names no row, so it is a row of its own: type "work setup" and
# press Enter. A step that fails does not stop the rest, so this still opens the
# three apps you have installed out of four.

[work-setup]
name = "Work setup"
icon = "🚀"
do = [
  "open -a Slack",
  "open -a Ghostty",
  "open -a Safari https://github.com/pulls",
]

# Asked by the installer, one field per app, so the routine arrives as yours.
[[setup]]
label = "Chat app"
block = "work-setup"
key   = "do"
match = "Slack"
note  = "An app name, as `open -a` wants it."

[[setup]]
label = "Terminal"
block = "work-setup"
key   = "do"
match = "Ghostty"

[[setup]]
label = "Browser"
block = "work-setup"
key   = "do"
match = "Safari"

[[setup]]
label = "First page of the day"
block = "work-setup"
key   = "do"
match = "https://github.com/pulls"
