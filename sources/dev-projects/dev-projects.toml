# Every project in ~/dev, as rows you can type for.
#
# A `dir` block's rows stay real folders, so preview, reveal, and copy all keep
# working on them. That is also why there is no `open` here: with none declared,
# Enter opens the folder the way Look opens any folder.

[dev-projects]
name    = "Projects"
icon    = "📁"
dir     = "~/dev"                  # or: dirs = ["~/dev", "~/work"]
depth   = 1                        # 1 = immediate children
only    = "dirs"
exclude = ["archive*", "node_modules"]

# `scope = true` makes the first word of a line narrow to this block, so
# `projects look` lists only your projects matching "look". Every single-word
# name and alias becomes one of those openers, which is why "code" is gone:
# it would have reserved the word your editor is called.
aliases = ["repo", "proj"]
scope   = true

# Typed in full, a name or alias otherwise loses to any deep folder that only
# starts with it (`repo` to `repository/`). 200 clears that; an exact folder
# name still wins.
bias    = 200

# Cmd+E on a project. Empty uses the editor in your Look config; fill it in
# only for an editor just for these rows.
edit = ""

# What the installer asks you, so the two lines above arrive already pointing
# at your machine instead of the author's. Each field names a real value, so
# this file still works as written if you copy it in by hand.

[[setup]]
label = "Your projects folder"
type  = "folder"
block = "dev-projects"
key   = "dir"
note  = "The folder whose children become rows. One level deep."

[[setup]]
label = "Editor for Cmd+E (blank: your usual one)"
block = "dev-projects"
key   = "edit"
note  = "A command with {path}: open -a 'Zed' {path}, code {path}, nvim {path}."
