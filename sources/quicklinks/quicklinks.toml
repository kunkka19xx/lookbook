name    = "Stack Overflow"
aliases = ["sof"]
icon    = "❓"
do      = ['''u="https://stackoverflow.com/search?q={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-godoc]
name    = "Go packages"
aliases = ["godoc"]
icon    = "🐹"
do      = ['''u="https://pkg.go.dev/search?q={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-crates]
name    = "crates.io"
aliases = ["crates"]
icon    = "🦀"
do      = ['''u="https://crates.io/search?q={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-youtube]
name    = "YouTube search"
aliases = ["yt"]
icon    = "📺"
# YouTube's parameter is `search_query`, not `q`: the short one silently
# lands you on the home page.
do      = ['''u="https://www.youtube.com/results?search_query={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-maps]
name    = "Google Maps"
aliases = ["maps"]
icon    = "🗺"
# The documented entry point for a search, rather than a /maps/search/<text>
# path: `api=1` is Google's promise that this URL keeps working.
do      = ['''u="https://www.google.com/maps/search/?api=1&query={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-dockerhub]
name    = "Docker Hub"
