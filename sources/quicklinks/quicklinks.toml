# The ten search boxes you otherwise reach by opening a tab first. Type the
# block's word, then what you are looking for:
#
#   ghs       ripgrep             GitHub repositories
#   npms      zustand             the npm registry
#   mdn       structuredClone     MDN
#   sof       rust lifetime       Stack Overflow
#   godoc     cobra               pkg.go.dev
#   crates    serde_json          crates.io
#   yt        wgpu talk           YouTube
#   maps      shibuya station     Google Maps
#   dhub      postgres            Docker Hub
#   caniuse   subgrid             caniuse.com
#
# `{arg}` is the rest of the line after that word, which is what keeps these
# rows findable by typing rather than only through Cmd+K: a `do` block naming
# any OTHER placeholder would be a then-target, because it would only mean
# something against a selected row.
#
# `{arg:url}` is the same value percent-encoded. It has to be, twice over: a
# space in `rust lifetime` is %20 rather than a second word, and a `&` or a `+`
# in what you typed would otherwise end the query string early and search for
# half of it. That is also why each URL is wrapped in quotes - `?` and `&` are
# shell punctuation - and why the quotes are safe: `:url` is the one
# substitution Look does not shell-escape, because what comes out of it is only
# A-Za-z0-9-._~%, which no shell reads as punctuation.
#
# Nothing here is installed, configured or signed in to. Each block is one URL,
# so the file is also the list of what it can reach: change a line and it goes
# somewhere else.
#
# One file for macOS, Linux and Windows, although Look reads each command with
# a different shell: a POSIX one on macOS and Linux, `cmd` on Windows. Every
# block is the same line with only its URL changed, and both shells read it:
#
#   set "url=<url>" && call start "" "%url%" || case ${OSTYPE:-$(uname)} ... esac
#
# - `set "url=<url>"` is the one command both understand. cmd sets %url%; sh
#   sets $1 to `url=<url>`. So each URL is written once.
# - `call start "" "%url%"` is Windows. cmd expands %url% when it reads the
#   line, before `set` has run; `call` expands it again once it has. On macOS
#   and Linux there is no `call`, so it fails and the `||` runs instead.
# - The `case` is macOS and Linux, and cmd never reaches it: `start`
#   succeeded. Darwin uses `open`; anything else uses `xdg-open`, never `open`,
#   which on some Linux distros is an unrelated program (openvt).
#
# The opener is the only program started. bash and zsh name the OS in $OSTYPE,
# so `uname` runs only under a shell that does not (dash), and `exec` hands the
# shell's own process to the opener instead of starting another. The trailing
# `\` in each block is TOML joining three lines into one: cmd stops reading at a
# newline.

[quicklinks-github]
name    = "GitHub search"
aliases = ["ghs"]
icon    = "🐙"
do      = ["""set "url=https://github.com/search?q={arg:url}&type=repositories" \
           && call start "" "%url%" \
           || case ${OSTYPE:-$(uname)} in [Dd]arwin*) exec open "${1#url=}" ;; *) exec xdg-open "${1#url=}" ;; esac"""]

[quicklinks-npm]
name    = "npm search"
