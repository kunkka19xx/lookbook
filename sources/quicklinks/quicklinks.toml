# The ten search boxes you otherwise reach by opening a tab first. Type the
# block's word, then what you are looking for:
#
#   ghs       ripgrep             GitHub repositories
#   npms      zustand             the npm registry
#   mdn       structuredClone     MDN
#   sof       rust lifetime       Stack Overflow
#   godoc     cobra               pkg.go.dev
#   crates    serde_json          crates.io
#   yt        wgpu talk           YouTube
#   maps      shibuya station     Google Maps
#   dhub      postgres            Docker Hub
#   caniuse   subgrid             caniuse.com
#
# `{arg}` is the rest of the line after that word, which is what keeps these
# rows findable by typing rather than only through Cmd+K: a `do` block naming
# any OTHER placeholder would be a then-target, because it would only mean
# something against a selected row.
#
# `{arg:url}` is the same value percent-encoded. It has to be, twice over: a
# space in `rust lifetime` is %20 rather than a second word, and a `&` or a `+`
# in what you typed would otherwise end the query string early and search for
# half of it. That is also why each URL is wrapped in quotes - `?` and `&` are
# shell punctuation - and why the quotes are safe: `:url` is the one
# substitution Look does not shell-escape, because what comes out of it is only
# A-Za-z0-9-._~%, which no shell reads as punctuation.
#
# Nothing here is installed, configured or signed in to. Each block is one URL,
# so the file is also the list of what it can reach: change a line and it goes
# somewhere else.
#
# Every line opens the URL with `open` on macOS, `xdg-open` on Linux and
# `start ""` on Windows. macOS is checked first, so it behaves exactly as before.
# Linux is tested by name rather than left to a fallback because some distros
# ship an unrelated `open` (openvt). Windows is the last branch and untested.

[quicklinks-github]
name    = "GitHub search"
aliases = ["ghs"]
icon    = "🐙"
do      = ['''u="https://github.com/search?q={arg:url}&type=repositories"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-npm]
name    = "npm search"
aliases = ["npms"]
icon    = "📦"
do      = ['''u="https://www.npmjs.com/search?q={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

[quicklinks-mdn]
name    = "MDN"
aliases = ["mdn"]
icon    = "🌐"
do      = ['''u="https://developer.mozilla.org/en-US/search?q={arg:url}"
    if [ "$(uname)" = Darwin ]; then open "$u"
    elif [ "$(uname)" = Linux ]; then xdg-open "$u"
    else start "" "$u"
    fi''']

