[quicklinks-youtube]
name    = "YouTube search"
aliases = ["yt"]
icon    = "📺"
# YouTube's parameter is `search_query`, not `q`: the short one silently
# lands you on the home page.
do      = ["""set "url=https://www.youtube.com/results?search_query={arg:url}" \
           && call start "" "%url%" \
           || case ${OSTYPE:-$(uname)} in [Dd]arwin*) exec open "${1#url=}" ;; *) exec xdg-open "${1#url=}" ;; esac"""]

[quicklinks-maps]
name    = "Google Maps"
aliases = ["maps"]
icon    = "🗺"
# The documented entry point for a search, rather than a /maps/search/<text>
# path: `api=1` is Google's promise that this URL keeps working.
do      = ["""set "url=https://www.google.com/maps/search/?api=1&query={arg:url}" \
           && call start "" "%url%" \
           || case ${OSTYPE:-$(uname)} in [Dd]arwin*) exec open "${1#url=}" ;; *) exec xdg-open "${1#url=}" ;; esac"""]

