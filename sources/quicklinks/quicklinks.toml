icon    = "🌐"
do      = ["""set "url=https://developer.mozilla.org/en-US/search?q={arg:url}" \
           && call start "" "%url%" \
           || case ${OSTYPE:-$(uname)} in [Dd]arwin*) exec open "${1#url=}" ;; *) exec xdg-open "${1#url=}" ;; esac"""]

