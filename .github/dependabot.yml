version: 2

updates:
  # The actions the workflows pin by commit. Dependabot moves the hash and the
  # version comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed: long enough for a
    # compromised one to be noticed and pulled before it lands here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The scanners scripts/security.sh installs.
  - package-ecosystem: pip
    directory: /scripts/security
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      scanners:
        patterns: ["*"]
