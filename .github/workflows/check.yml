name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    name: examples parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Look's own parsers are the only correct judge of these formats, so CI
      # borrows them rather than reimplementing the rules here.
      #
      # The checkout is made by check.sh, not by an actions/checkout step: the
      # script pins it to Look's latest RELEASE tag, which is the version an
      # example's README tells its reader to install. Checking out main here
      # instead would quietly test the examples against unreleased code.
      #
      # It runs before the cargo cache so the cache has a workspace to key on.
      - name: Check out the pinned Look
        run: ./scripts/check.sh --clone-only

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .look-src/core

      # Builds two parsers out of the checkout above: look-sources' parse_check
      # for sources/, and look-engine's launchpad_check for tiles/.
      - run: make check
