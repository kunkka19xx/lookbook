name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for what it reads. See security.yml for why
# the actions below are pinned to commits.
permissions: {}

jobs:
  examples:
    name: examples parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this pushes, and check.sh clones Look anonymously.
          persist-credentials: false

      # Look's own parsers are the only correct judge of these formats, so CI
      # borrows them rather than reimplementing the rules here.
      #
      # The checkout is made by check.sh, not by an actions/checkout step: the
      # script pins it to Look's latest RELEASE tag, which is the version an
      # example's README tells its reader to install. Checking out main here
      # instead would quietly test the examples against unreleased code.
      #
      # It runs before the cargo cache so the cache has a workspace to key on.
      - name: Check out the pinned Look
        run: ./scripts/check.sh --clone-only

      # The runner image already has rustup, so this needs no action of its
      # own: one fewer third party with a say in what this job runs.
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .look-src/core

      # Builds two parsers out of the checkout above: look-sources' parse_check
      # for sources/, and look-engine's launchpad_check for tiles/.
      - run: make check
